name: Weekly GSC + GA4 digest

on:
  schedule:
    # Mondays at 08:00 UTC (09:00 Dublin)
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Restore Google credentials (service account preferred, legacy tokens fallback)
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          GA4_TOKEN_JSON: ${{ secrets.GA4_TOKEN_JSON }}
        run: |
          if [ -n "$SA_JSON" ]; then
            # Preferred path: service-account key as raw JSON (never expires).
            {
              echo 'GOOGLE_SERVICE_ACCOUNT_JSON<<EOF'
              printf '%s\n' "$SA_JSON"
              echo 'EOF'
            } >> "$GITHUB_ENV"
            echo "Service account secret found - using it."
          elif [ -n "$GSC_TOKEN_JSON" ] && [ -n "$GA4_TOKEN_JSON" ]; then
            # Legacy fallback: user-OAuth refresh tokens.
            mkdir -p .tokens
            # printf is more reliable than echo for content with backslashes
            printf '%s' "$GSC_TOKEN_JSON" > .tokens/.gsc-token.json
            printf '%s' "$GA4_TOKEN_JSON" > .tokens/.ga4-admin-token.json
            chmod 600 .tokens/.gsc-token.json .tokens/.ga4-admin-token.json
            echo "GSC_TOKEN_PATH=.tokens/.gsc-token.json" >> "$GITHUB_ENV"
            echo "GA4_TOKEN_PATH=.tokens/.ga4-admin-token.json" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" ]; then
              echo "GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" >> "$GITHUB_ENV"
            fi
            if [ -n "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" ]; then
              echo "GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" >> "$GITHUB_ENV"
            fi
            echo "Legacy token secrets restored (service-account secret not set)."
          else
            echo "No Google credentials available. Set the GOOGLE_SERVICE_ACCOUNT_JSON secret (preferred) or GSC_TOKEN_JSON + GA4_TOKEN_JSON (legacy)." >&2
            exit 1
          fi

      - name: Generate weekly report
        run: |
          node scripts/weekly-report.js --days=7

      - name: Cleanup tokens
        if: always()
        run: rm -rf .tokens

      - name: Commit + push if report changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "chore: weekly report ${DATE} [skip ci]"
            git push
          fi
